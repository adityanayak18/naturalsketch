# Render Blueprint for the NaturalSketch backend (API, build jobs, previews of generated apps).
# The frontend is served by Vercel, which forwards /api/* here (see vercel.json).
services:
  - type: web
    name: naturalsketch-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: HOST
        value: 0.0.0.0
      # Where the frontend lives (Vercel, on the custom domain).
      - key: NS_APP_ORIGIN
        value: https://naturalsketch.openarc.in
      # This service's own address; generated apps are previewed here.
      - key: NS_PREVIEW_ORIGIN
        value: https://naturalsketch-api.onrender.com
      # Required in this setup: the password for the studio.
      - key: NS_ACCESS_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
