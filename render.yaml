# Render Blueprint for the NaturalSketch backend (API, build jobs, previews of generated apps).
# The frontend is served by Vercel, which forwards /api/* here (see vercel.json).
services:
  - type: web
    name: naturalsketch-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: HOST
        value: 0.0.0.0
      # Where the frontend lives (Vercel, on the custom domain).
      - key: NS_APP_ORIGIN
        value: https://naturalsketch.openarc.in
      # This service's own address; generated apps are previewed here.
      - key: NS_PREVIEW_ORIGIN
        value: https://naturalsketch-api.onrender.com
      # Builds + chat edits per account per day (0 = unlimited).
      - key: NS_DAILY_LIMIT
        value: "20"
      # Set these in the Render dashboard (Environment), never in this file:
      # Supabase > Project Settings > API Keys > publishable (or anon) key. Turns accounts on.
      - key: SUPABASE_ANON_KEY
        sync: false
      # Your own sign-in email(s), comma-separated: unlimited builds, and owner of older projects.
      - key: NS_ADMIN_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
